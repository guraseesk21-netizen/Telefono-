<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phone OS Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body, html { width: 100%; height: 100%; background-color: #121212; display: flex; justify-content: center; align-items: center; overflow: hidden; }

    .phone { width: 100%; max-width: 412px; height: 100%; max-height: 860px; background: #000; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

    .status-bar { height: 35px; background: rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; color: #fff; font-size: 13px; position: absolute; top: 0; left: 0; right: 0; z-index: 100; }
    
    .screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; padding-top: 35px; background-size: cover; background-position: center; }
    .screen.active { display: flex; }

    /* SCHERMATA HOME */
    #home-screen { background: linear-gradient(180deg, #0f2027 0%, #203a43 50%, #2c5364 100%); padding: 50px 20px; justify-content: space-between; }
    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .app-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .app-icon { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; }
    .app-label { font-size: 11px; color: white; }

    /* APP VIEW */
    .app-view { background: #121212; color: white; }
    .app-header { height: 50px; background: #1e1e1e; display: flex; align-items: center; padding: 0 15px; gap: 15px; border-bottom: 1px solid #2a2a2a; }
    .back-btn { font-size: 18px; cursor: pointer; color: #007aff; }
    
    /* Iframe per la Chat */
    .iframe-container { flex: 1; width: 100%; height: 100%; border: none; background: white; }
  </style>
</head>
<body>

<div class="phone">
  <div class="status-bar"><span>14:30</span></div>

  <!-- SCHERMATA HOME -->
  <div id="home-screen" class="screen active">
    <div class="app-grid">
      <div class="app-item" onclick="goToScreen('chat-app')">
        <div class="app-icon" style="background:#25D366;"><i class="fa-brands fa-whatsapp"></i></div>
        <span class="app-label">WhatsApp</span>
      </div>
      <!-- Altre app (aggiunte velocemente) -->
      <div class="app-item" onclick="alert('App non ancora implementata')">
        <div class="app-icon" style="background:#ff9f0a;"><i class="fa-solid fa-note-sticky"></i></div>
        <span class="app-label">Note</span>
      </div>
    </div>
  </div>

  <!-- APP CHAT (WhatsApp) -->
  <div id="chat-app" class="screen app-view">
    <div class="app-header">
      <i class="fa-solid fa-chevron-left back-btn" onclick="goToScreen('home-screen')"></i>
      <h2>WhatsApp</h2>
    </div>
    <iframe src="https://guraseesk21-netizen.github.io/Chat/" class="iframe-container"></iframe>
  </div>
</div>

<script>
  function goToScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }
</script>

</body>
</html>
